<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f2" />
    <meta name="application-name" content="阿瓦隆圆桌" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="阿瓦隆" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (() => {
        let preference = 'system';
        try {
          preference = localStorage.getItem('avalon.theme') || 'system';
        } catch {}
        const theme =
          preference === 'light' || preference === 'dark'
            ? preference
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = theme === 'dark' ? '#101a15' : '#f5f6f2';
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#101a15' : '#f5f6f2';
      })();
    </script>
    <meta name="description" content="阿瓦隆圆桌：和朋友面对面，把身份和流程交给手机。" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>阿瓦隆 · 圆桌</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
