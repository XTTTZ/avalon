name: Deploy Avalon

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Apply the idempotent PostgreSQL schema before deployment
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: avalon-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      upload_deployment_artifact: true

  deploy:
    needs: verify
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.CUSTOM_DOMAIN_ENABLED == 'true' && 'https://www.avalonxty.site' || 'https://avalon.avalon-roundtable.workers.dev' }}
    env:
      APP_ORIGIN: https://www.avalonxty.site
      WORKERS_DEV_ORIGIN: https://avalon.avalon-roundtable.workers.dev
      CUSTOM_DOMAIN: www.avalonxty.site
      CUSTOM_DOMAIN_ENABLED: ${{ vars.CUSTOM_DOMAIN_ENABLED || 'false' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm the deployment commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install deployment dependencies
        run: npm ci

      - name: Download the verified production build
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: avalon-deployment-${{ github.sha }}
          path: ${{ runner.temp }}/avalon-deployment

      - name: Restore the verified production build
        run: |
          tar -xzf "$RUNNER_TEMP/avalon-deployment/avalon-deployment.tgz"
          test -f dist/index.html

      - name: Check deployment credentials
        env:
          NEON_DIRECT_DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          IDENTITY_SECRET: ${{ secrets.IDENTITY_SECRET }}
        run: |
          node --input-type=module <<'JS'
          const required = [
            'CLOUDFLARE_ACCOUNT_ID',
            'CLOUDFLARE_API_TOKEN',
            'NEON_DIRECT_DATABASE_URL',
            'NEON_DATABASE_URL',
            'SESSION_SECRET',
            'IDENTITY_SECRET',
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) throw new Error(`Missing deployment settings: ${missing.join(', ')}`);
          if (!['true', 'false'].includes(process.env.CUSTOM_DOMAIN_ENABLED))
            throw new Error('CUSTOM_DOMAIN_ENABLED must be true or false.');
          JS

      - name: Apply PostgreSQL schema
        if: github.event_name == 'push' || inputs.run_migrations
        env:
          NEON_DIRECT_DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
        run: |
          for migration in migrations/*.sql; do
            psql -X --dbname="$NEON_DIRECT_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Deploy Worker and static assets
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          IDENTITY_SECRET: ${{ secrets.IDENTITY_SECRET }}
        run: |
          SECRETS_FILE="$RUNNER_TEMP/avalon-worker-secrets.json"
          export SECRETS_FILE
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const secrets = {
            DATABASE_URL: process.env.NEON_DATABASE_URL,
            SESSION_SECRET: process.env.SESSION_SECRET,
            IDENTITY_SECRET: process.env.IDENTITY_SECRET,
          };
          writeFileSync(process.env.SECRETS_FILE, JSON.stringify(secrets), { mode: 0o600 });
          JS
          DEPLOY_ARGS=(
            --secrets-file "$SECRETS_FILE"
            --message "$GITHUB_SHA"
            --var "APP_VERSION:$GITHUB_SHA"
          )
          if [[ "$CUSTOM_DOMAIN_ENABLED" == true ]]; then
            DEPLOY_ARGS+=(--domain "$CUSTOM_DOMAIN")
          fi
          npx wrangler deploy "${DEPLOY_ARGS[@]}"

      - name: Check the published site and API
        run: |
          ORIGINS=("$WORKERS_DEV_ORIGIN")
          if [[ "$CUSTOM_DOMAIN_ENABLED" == true ]]; then
            ORIGINS+=("$APP_ORIGIN")
          fi
          for origin in "${ORIGINS[@]}"; do
            curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 "$origin/" > /dev/null
            curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 "$origin/api/health" > /dev/null
          done
