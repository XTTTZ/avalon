name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: avalon_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d avalon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Run unit tests
        run: npm test
      - name: Test PostgreSQL cleanup and private note retention
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: avalon_test
          PGUSER: postgres
          PGPASSWORD: local-test-only
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres-cleanup.sql
      - name: Check types and build
        env:
          VITE_AUTH_MODE: guest
          VITE_API_URL: /api
        run: npm run build
      - name: Check independent cloud function dependencies
        run: npm ci --prefix cloudfunctions/avalon --omit=dev
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser tests
        env:
          VITE_AUTH_MODE: guest
          VITE_API_URL: /api
        run: npm run test:e2e
      - name: Keep failed browser test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
